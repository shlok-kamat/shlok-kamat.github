# a summary about you
summary: 'मैं शिव नादर विश्वविद्यालय में इलेक्ट्रिकल इंजीनियरिंग विभाग में इलेक्ट्रिकल और इलेक्ट्रॉनिक्स इंजीनियरिंग में स्नातक की पढ़ाई कर रहा हूं। मैं वसंत, 2024 में स्नातक होने की उम्मीद करता हूं। मैं एक ऐसे भविष्य की दिशा में काम करने वाला एक समर्पित छात्र हूं जहां मैं ऑटोमोटिव इलेक्ट्रॉनिक्स और रक्षा प्रौद्योगिकी में बहुत योगदान दे सकता हूं। मुझे खुद को चुनौती देना पसंद है; मैं वर्तमान में सांख्यिकीय कंप्यूटिंग के लिए आर सीख रहा हूं और सार्वजनिक डेटा-सेट पर खोजपूर्ण डेटा विश्लेषण करके अपने सीखने को आगे बढ़ाने की योजना बना रहा हूं।'

